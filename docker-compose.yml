services:
  quiz-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: technova-quiz:latest

    container_name: technova_quiz

    restart: unless-stopped

    ports:
      - "${PORT:-3004}:3000"

    env_file:
      - .env.local

    volumes:
      - ./data:/app/data

    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    labels:
      kuma.monitor: "true"
      kuma.url: "http://technova_quiz:3000"
