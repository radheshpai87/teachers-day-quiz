version: '3.8'

services:
  quiz-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teachers_day_quiz
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      # Mount host ./data directory into container to persist SQLite quiz.db
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
